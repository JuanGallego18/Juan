<!-- ============================================================
     MODAL: SUBIR FOTO
     JS relacionado: js/photos.js
     ============================================================ -->
<div class="modal-bg" id="modal-photo">
  <div class="modal">
    <h3>Subir foto de progreso</h3>
    <div class="field"><label>Imagen</label><input id="p-file" type="file" accept="image/*"></div>
    <div class="field"><label>Fecha</label><input id="p-date" type="date"></div>
    <div class="field"><label>Nota</label><input id="p-note" placeholder="Ej. Semana 6, después de rutina de tren superior"></div>
    <div class="modal-actions">
      <button class="btn" data-close="modal-photo">Cancelar</button>
      <button class="btn btn-primary" id="savePhotoBtn">Guardar foto</button>
    </div>
  </div>
</div>
