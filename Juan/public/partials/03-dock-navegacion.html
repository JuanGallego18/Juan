<!-- ============================================================
     SECCIÓN: DOCK DE NAVEGACIÓN FLOTANTE
     CSS relacionado: css/secciones/04-dock-navegacion.css
     JS relacionado:  js/nav.js
     Nota: las clases nav-dot y data-section NO se deben renombrar,
     js/nav.js depende de ellas para saber a qué pantalla ir.
     Si agregas una pantalla nueva, agrega aquí su botón Y crea
     su propio archivo en partials/ (ver README de partials).
     ============================================================ -->
<nav class="orbit-dock">
  <div class="dock-inner">
    <button class="nav-dot active" data-section="hub" title="Hub">
      <svg viewBox="0 0 24 24"><path d="M3 12l9-9 9 9M5 10v10h14V10"/></svg>
      <span class="tip">Inicio</span>
    </button>
    <button class="nav-dot" data-section="metas" title="Metas">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".5"/></svg>
      <span class="tip">METAS</span>
    </button>
    <button class="nav-dot" data-section="calistenia" title="Calistenia">
      <svg viewBox="0 0 24 24"><path d="M6 8v8M18 8v8M2 11h3v2H2zM19 11h3v2h-3zM6 12h12"/></svg>
      <span class="tip">CALISTENIA</span>
    </button>
    <button class="nav-dot" data-section="gastos" title="Gastos">
      <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/></svg>
      <span class="tip">GASTOS</span>
    </button>
    <button class="nav-dot" data-section="juegos" title="Juegos">
      <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 10v4M5 12h4M16.5 11.5h.01M19 13.5h.01"/></svg>
      <span class="tip">JUEGOS</span>
    </button>
  </div>
</nav>
